[workspace]
members = ["programs/*"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

# `overflow-checks` LIGADO em release, e isto não é detalhe.
#
# Por padrão o Rust desliga a checagem de estouro em release: uma soma que
# passa do limite dá a volta em silêncio em vez de falhar. Num programa que
# mexe com saldo, dar a volta no contador é exatamente como se drena uma
# reserva. Aqui, estourar aborta a transação.
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
